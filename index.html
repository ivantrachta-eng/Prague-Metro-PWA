<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MHD hlášení" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>MHD hlášení – výběr města</title>
  <style>
    :root{color-scheme:light dark;--bg:#f3f4f6;--panel:#fff;--text:#111827;--muted:#6b7280;--border:#d1d5db;--praha:#0ea5e9;--ostrava:#2563eb}
    @media(prefers-color-scheme:dark){:root{--bg:#0b1020;--panel:#111827;--text:#f9fafb;--muted:#9ca3af;--border:#374151}}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;background:var(--bg);color:var(--text);display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom))}.launcher{width:min(100%,720px)}h1{font-size:2rem;margin:0 0 8px;text-align:center}.subtitle{margin:0 0 28px;text-align:center;color:var(--muted);font-size:1rem}.city-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.city-btn{min-height:260px;border-radius:28px;text-decoration:none;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:1.65rem;font-weight:800;box-shadow:0 14px 30px rgba(0,0,0,.16);transition:transform .12s ease,filter .12s ease}.city-btn:active{transform:scale(.985)}.city-btn.praha{background:var(--praha)}.city-btn.ostrava{background:var(--ostrava)}.city-icon{font-size:4.5rem;line-height:1}.city-sub{font-size:.9rem;font-weight:600;opacity:.9}@media(max-width:620px){.city-grid{grid-template-columns:1fr}.city-btn{min-height:210px}h1{font-size:1.7rem}}
  </style>
</head>
<body>
  <main class="launcher">
    <h1>MHD hlášení</h1>
    <p class="subtitle">Vyberte město</p>
    <div class="city-grid">
      <a class="city-btn praha" href="praha/" aria-label="Spustit MHD Praha">
        <span class="city-icon" aria-hidden="true">🚇</span>
        <span>MHD Praha</span>
        <span class="city-sub">Metro · Tramvaje · Autobusy</span>
      </a>
      <a class="city-btn ostrava" href="ostrava/" aria-label="Spustit MHD Ostrava">
        <span class="city-icon" aria-hidden="true">🚋</span>
        <span>MHD Ostrava</span>
        <span class="city-sub">Tramvaje · Trolejbusy · Autobusy</span>
      </a>
    </div>
  </main>
  <script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));</script>
</body>
</html>
