<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ostravská doprava" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <title>Ostravská doprava – hlášení</title>
</head>
<body>
  <main class="app-shell">
    <header class="hero"><h1>Ostravská doprava</h1><div id="lineBadge" class="line-badge">1</div></header>
    <a href="../" style="display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:.9rem;margin-top:-8px">← Změnit město</a>

    <section class="panel mode-panel" aria-label="Dopravní prostředek">
      <div class="mode-picker">
        <button class="mode-btn active" data-mode="tram" type="button"><span class="mode-icon">🚋</span><span>Tramvaj</span></button>
        <button class="mode-btn" data-mode="trolleybus" type="button"><span class="mode-icon">🚎</span><span>Trolejbus</span></button>
        <button class="mode-btn" data-mode="bus" type="button"><span class="mode-icon">🚌</span><span>Autobus</span></button>
      </div>
    </section>

    <section class="panel controls">
      <label>Linka<select id="lineSelect"></select></label>
      <label>Směr / varianta<select id="directionSelect"></select></label>
      <label>Zastávka<select id="stationSelect"></select></label>
    </section>

    <section class="panel announcement-panel">
      <p id="announcementText" class="announcement"></p>
      <label class="auto-next"><span>Automaticky další zastávka</span><span class="ios-switch"><input id="autoNext" type="checkbox" role="switch"/><span class="ios-slider"></span></span></label>
      <div class="play-zone"><button id="playBtn" class="primary play-main">Spustit hlášení</button></div>
      <div class="nav-row"><button id="prevBtn" class="secondary">Předchozí</button><button id="nextBtn" class="secondary">Další</button></div>
      <p id="status" hidden></p>
    </section>

    <section class="panel"><div class="panel-head"><span>Trasa</span><span id="stationCount" class="chip"></span></div><div id="routeList" class="route-list"></div></section>
  </main>
  <script src="app.js"></script>
  <script src="playback-lock.js"></script>
</body>
</html>
